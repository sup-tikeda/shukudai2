# アプリ・リバースプロキシ（nginx）・メール送信（docker-mailserver）の構成。
# データベースはNeon（クラウドのPostgreSQL）に移行済みで、.envのDATABASE_URLで指定する
# （「データベースをNeonに移行した経緯」参照）。ローカルのpostgresサービスはロールバック用に
# 残してあるだけで、通常は起動しない。
#
# アプリまでコンテナで動かす（nginx経由でアクセスする）:
#   docker compose up -d --build
name: shukudai2

services:
  # ロールバック用に残しているだけで、通常は使わない（DBは.envのDATABASE_URL＝Neonを使う）。
  # 復旧したい場合は `docker compose up -d postgres` で起動し、.envのDATABASE_URLを
  # localhost:${POSTGRES_PORT}向けに戻す。
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      TZ: Asia/Tokyo
    ports:
      # ホスト側の5432は既存のローカルPostgreSQLが使用している場合があるため5433を割り当てる
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - rollback

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    # SMTP設定や BETTER_AUTH_SECRET は .env から読む
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      # DATABASE_URL は .env の値（Neon）をそのまま使う。
      # 利用者が実際にブラウザで開くURL。
      # ここがずれるとサーバー関数のCSRF検証（Origin比較）が403になる。
      # Cloudflare Tunnel経由で公開する場合は、発行されたURLを.envのTUNNEL_PUBLIC_URLに設定する。
      BETTER_AUTH_URL: ${TUNNEL_PUBLIC_URL:-http://localhost:${NGINX_PORT:-8080}}
      # コンテナ内からはホスト名 mailserver・ポート25で送信する（.env の値を上書き）
      SMTP_HOST: mailserver
      SMTP_PORT: "25"
    depends_on:
      mailserver:
        condition: service_started
    # nginx経由でのみアクセスする想定のため、ホストへは直接公開しない。
    # 直接確認したい場合は一時的に "3100:3000" などを追記する。
    expose:
      - "3000"

  nginx:
    build:
      context: ./nginx
    restart: unless-stopped
    environment:
      # 公開前のBasic認証用。値は.envで管理し、イメージには焼き込まない。
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?BASIC_AUTH_USERを.envに設定してください}
      BASIC_AUTH_PASSWORD: ${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORDを.envに設定してください}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      - app

  mailserver:
    image: docker.io/mailserver/docker-mailserver:latest
    restart: unless-stopped
    hostname: mail
    domainname: ${MAIL_DOMAIN:-shukudai2.local}
    environment:
      TZ: Asia/Tokyo
      # 外部ドメインへの実配信は行わず、社内アプリからの通知メール送信専用として使う。
      # 同じDockerネットワーク内からは認証なしでリレーを許可する。
      PERMIT_DOCKER: network
      # ローカル/社内利用のためTLS証明書は設定しない
      SSL_TYPE: ""
      ENABLE_SPAMASSASSIN: 0
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 0
      ONE_DIR: 1
    cap_add:
      - NET_ADMIN
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - mail_config:/tmp/docker-mailserver
    ports:
      # ホストから送信テストする場合に使う（例: pnpm dev をホストで動かす時）
      - "${MAIL_SMTP_PORT:-2525}:25"

  # インターネット経由で一時的に外部公開するためのトンネル（Cloudflare Quick Tunnel）。
  # 独自ドメイン不要で、起動のたびにランダムな https://*.trycloudflare.com のURLが発行される。
  # 常設の固定URLではないため、社内の一時的な動作確認・共有用と割り切ること。
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx

  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
      # サーバー一覧のマスターパスワード入力を省略する（ローカル開発専用のため）
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  mail_data:
  mail_state:
  mail_logs:
  mail_config:

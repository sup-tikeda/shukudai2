# アプリ（TanStack Start / server.mjs）へのリバースプロキシ設定。
#
# $host ではなく $http_host を渡すこと。
# $host はポート番号を含まないため、BETTER_AUTH_URL（ポート込み）と
# 一致しなくなり、better-authのサーバー関数のCSRF検証（Origin/Hostの比較）が
# 403になる（README「実装上の注意点」参照）。
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # better-authのセッション確認など、常に最新の応答を返す
        proxy_buffering off;
    }
}
